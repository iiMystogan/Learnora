name: Temporary dependency audit remediation

on:
  push:
    branches:
      - security/phase-1-backend

permissions:
  contents: write

jobs:
  audit-and-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          ref: security/phase-1-backend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply compatible dependency security fixes
        run: npm audit fix
      - name: Verify clean install
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Report remaining audit findings
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); console.log("Audit totals:", JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name,v] of Object.entries(a.vulnerabilities ?? {})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,paths:v.nodes}));'
      - name: Commit verified lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: update vulnerable dependencies"
            git push origin HEAD:security/phase-1-backend
          else
            echo "No lockfile changes to commit."
          fi
